version: 2
project_name: brout

builds:
  - main: ./cmd/brout
    binary: brout
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{ .Version }}']
    hooks:
      post:
        - cmd: ./scripts/sign-darwin.sh "{{ .Path }}" "{{ .Os }}"
          output: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/reference.md

checksum:
  name_template: checksums.txt
